<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 13 - Form</title><link rel="stylesheet" href="../styles.css"><style>form{max-width:500px}label{display:block;margin-top:14px;font-weight:bold}input,textarea{width:100%;padding:12px;border:2px solid #aebbb3}input:focus,textarea:focus{border-color:#ff795f;outline:0}.submit{margin-top:15px;padding:12px 18px;color:#fff;background:#17211f;border:0}</style></head><body><main class="wrap program-page"><header class="program-header"><p class="program-number">CSS-13</p><h1>Styled registration form</h1><p>Consistent spacing and focus states make a form clearer to complete.</p></header><section class="demo"><form><label for="name">Name</label><input id="name" required><label for="email">Email</label><input id="email" type="email" required><label for="note">Message</label><textarea id="note" rows="4"></textarea><button class="submit">Register</button></form></section><nav class="back-nav"><a href="index.html">← CSS Programs</a><a href="../index.html">Home</a></nav></main></body></html>
