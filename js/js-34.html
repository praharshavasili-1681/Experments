<!doctype html><html><head><meta charset=utf-8><title>JS 34 - Stopwatch</title><link rel=stylesheet href=../styles.css></head><body><main class="wrap program-page"><h1>Stopwatch</h1><section class=demo><h2 id=t>0</h2><button onclick="running=!running;if(running)timer=setInterval(()=>t.textContent=++seconds,1000);else clearInterval(timer)">Start / stop</button></section><nav class=back-nav><a href=index.html>← Programs</a><a href=../index.html>Home</a></nav></main><script>let seconds=0;let running=false;let timer</script></body></html>
