<!doctype html><html><head><meta charset=utf-8><title>JS 30 - Input validation</title><link rel=stylesheet href=../styles.css></head><body><main class="wrap program-page"><h1>Validate name, email, phone, and password</h1><section class=demo><input id=n placeholder=Name><input id=e type=email placeholder=Email><input id=p placeholder=Phone><input id=w type=password placeholder=Password><button onclick="r.textContent=n.value&&e.validity.valid&&p.value.length>=10&&w.value.length>=8?'All fields valid':'Check each field'">Validate</button><p id=r></p></section><nav class=back-nav><a href=index.html>← Programs</a><a href=../index.html>Home</a></nav></main></body></html>
