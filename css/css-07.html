<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 07 - Positioning</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="css-demo.css"><style>.position-stage{position:relative;height:300px;background:#eef0e9}.position-stage div{padding:12px;background:#c7ed69}.relative{position:relative;left:30px;top:15px}.absolute{position:absolute;right:20px;bottom:20px}.fixed{position:fixed;right:18px;bottom:18px;background:#ff795f!important}.sticky{position:sticky;top:0;background:#9edbe5!important}</style></head><body><main class="wrap program-page"><header class="program-header"><p class="program-number">CSS-07</p><h1>CSS positioning</h1><p>Static is normal flow; relative offsets itself; absolute leaves flow; fixed follows the viewport; sticky holds at a threshold.</p></header><section class="demo css-demo position-stage"><div>static</div><div class="relative">relative</div><div class="absolute">absolute</div><div class="sticky">sticky</div><div class="fixed">fixed</div></section><nav class="back-nav"><a href="index.html">← CSS Programs</a><a href="../index.html">Home</a></nav></main></body></html>
