<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CSS 35 - Overflow</title><link rel=stylesheet href=../styles.css><style>.overflow{display:flex;gap:15px}.overflow div{width:42%;height:120px;padding:12px;border:2px solid #17211f}.hidden{overflow:hidden}.scroll{overflow:auto}@media(max-width:650px){.overflow{flex-direction:column}.overflow div{width:100%}}</style></head><body><main class="wrap program-page"><header class=program-header><p class=program-number>CSS-35</p><h1>Overflow properties</h1><p>Hidden clips extra content while auto provides a scrollbar when needed.</p></header><section class="demo overflow"><div class=hidden>Hidden: this long line extends beyond the box and is clipped from view.</div><div class=scroll>Auto: this long line can be scrolled when it does not fit inside the fixed-height box.</div></section><nav class=back-nav><a href=index.html>← CSS Programs</a><a href=../index.html>Home</a></nav></main></body></html>
