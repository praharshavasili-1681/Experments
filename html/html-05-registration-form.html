<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Registration Form</title><link rel="stylesheet" href="../styles.css"></head><body>
<header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html"><span class="brand-mark">{ }</span> Practical Lab</a><div class="nav-links"><a href="../index.html">Home</a><a href="index.html">Programs</a></div></nav></header><main class="wrap program-page"><header class="program-header"><p class="program-number">HTML-05</p><h1>Student registration</h1><p>A form groups user inputs and submits them as a meaningful record.</p></header><section class="demo"><form id="registrationForm"><div class="track-grid" style="margin-top:0"><div><div class="field"><label for="full-name">Full name</label><input id="full-name" name="fullName" required></div><div class="field"><label for="student-email">Email</label><input id="student-email" name="email" type="email" required></div></div><div><div class="field"><label for="course">Course</label><select id="course" name="course"><option>Web Development</option><option>Data Science</option><option>Design</option></select></div><div class="field"><label for="message">Why are you joining?</label><textarea id="message" name="message" rows="3"></textarea></div></div></div><button class="action" type="submit">Register student</button><p class="result" id="formResult" role="status"></p></form></section><nav class="back-nav"><a href="index.html">← HTML Programs</a><a href="../index.html">Home</a></nav></main><script>document.getElementById('registrationForm').addEventListener('submit', function(event) { event.preventDefault(); document.getElementById('formResult').textContent = 'Registration captured successfully for ' + document.getElementById('full-name').value + '.'; });</script></body></html>
