<!doctype html><html><head><meta charset=utf-8><title>JS 65 - Email regex</title><link rel=stylesheet href=../styles.css></head><body><main class="wrap program-page"><h1>Email validation with regex</h1><section class=demo><input id=e value=student@example.com><button onclick="r.textContent=/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(e.value)?'Valid email':'Invalid email'">Validate email</button><p id=r></p></section><nav class=back-nav><a href=index.html>← Programs</a><a href=../index.html>Home</a></nav></main></body></html>
