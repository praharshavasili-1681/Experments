<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CSS 43 - Filters</title><link rel=stylesheet href=../styles.css><style>.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters img{width:100%;height:130px;object-fit:cover}.blur{filter:blur(3px)}.gray{filter:grayscale(1)}.bright{filter:brightness(1.5)}.contrast{filter:contrast(1.7)}@media(max-width:650px){.filters{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap program-page"><header class=program-header><p class=program-number>CSS-43</p><h1>CSS filters</h1><p>Blur, grayscale, brightness, and contrast are applied to the same source image.</p></header><section class="demo filters"><img class=blur src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400&q=80" alt="Blur filter"><img class=gray src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400&q=80" alt="Grayscale filter"><img class=bright src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400&q=80" alt="Brightness filter"><img class=contrast src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400&q=80" alt="Contrast filter"></section><nav class=back-nav><a href=index.html>← CSS Programs</a><a href=../index.html>Home</a></nav></main></body></html>
