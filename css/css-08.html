<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 08 - Float</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="css-demo.css"><style>.float-demo img{float:left;width:130px;height:130px;object-fit:cover;margin:0 18px 10px 0}.clear{clear:both;padding-top:15px;border-top:2px solid #17211f}</style></head><body><main class="wrap program-page"><header class="program-header"><p class="program-number">CSS-08</p><h1>Float & clear</h1><p>Float lets text wrap around an object; clear stops later content from flowing beside it.</p></header><section class="demo css-demo float-demo"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=300&q=80" alt="Code on a laptop"><p>Floating media can sit alongside a paragraph. This older layout technique still helps explain how content flow works.</p><p class="clear">Cleared content begins below the floated image.</p></section><nav class="back-nav"><a href="index.html">← CSS Programs</a><a href="../index.html">Home</a></nav></main></body></html>
