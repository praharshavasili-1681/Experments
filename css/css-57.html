<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CSS 57 - Shopping</title><link rel=stylesheet href=../styles.css><style>.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #d7ddd4;padding:15px}.item img{width:100%;aspect-ratio:1;object-fit:cover}.item button{padding:8px;background:#17211f;color:#fff;border:0}@media(max-width:650px){.shop{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap program-page"><header class=program-header><p class=program-number>CSS-57</p><h1>Online shopping webpage</h1><p>Grid creates a browsable product shelf that adapts across widths.</p></header><section class="demo shop"><article class=item><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" alt="White shirt"><h2>Everyday tee</h2><button>View item</button></article><article class=item><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&q=80" alt="Red sneaker"><h2>Trail runner</h2><button>View item</button></article><article class=item><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" alt="Watch"><h2>Field watch</h2><button>View item</button></article></section><nav class=back-nav><a href=index.html>← CSS Programs</a><a href=../index.html>Home</a></nav></main></body></html>
